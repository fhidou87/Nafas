name: Build Nafas APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare the signing key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nafas.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/nafas.jks" >> "$GITHUB_ENV"
            echo "Signing with your own key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. The APK is signed with a temporary key, so it cannot update an earlier install."
          fi

      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Nafas-1.0.${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Nafas-APK-${{ github.run_number }}
          path: out/*.apk

      - name: Publish a release (tags that start with v)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
