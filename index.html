<title>Nafas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nafas: run and track breathing sessions, guided by sound, touch and sight.">
<meta name="theme-color" content="#EDF1EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&family=Noto+Naskh+Arabic:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Sans+Tifinagh&display=swap">
<style>
/* Layout: one quiet column (max 34rem). A breathing "Breathe now" panel on top, need tiles two-up, list rows below.
   Sessions run full-screen; sheets rise from the bottom. */
:root{
  --bg:#EDF1EF; --surface:#F9FBFA; --surface-2:#E1E9E6; --fg:#17302B; --muted:#556964; --line:#CCD8D4;
  --accent:#2B6A60; --accent-ink:#F5FBF9; --accent-soft:#D2E6E0;
  --calm:#4A80A1; --sleep:#6861A6; --focus:#57884A; --energize:#AC702A; --meditate:#7A7F86;
  --warn:#8A5212; --warn-bg:#F4E8D4; --danger:#A23A31;
  --orb-a:#A6D6CB; --orb-b:#4C9286; --orb-glow:rgba(76,146,134,.20);
  --scrim:rgba(12,24,22,.45);
  --dim-bg:#030505; --dim-fg:#4F5E5B; --dim-line:#18211F; --dim-orb-a:#22413B; --dim-orb-b:#112622;
  --f-display:"Young Serif","Noto Naskh Arabic","Iowan Old Style",Georgia,serif;
  --f-body:"Figtree","IBM Plex Sans Arabic","Noto Sans Tifinagh",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#151F1D; --surface-2:#1D2A27; --fg:#E1EAE7; --muted:#93A6A1; --line:#283633;
    --accent:#86C4B8; --accent-ink:#0B1916; --accent-soft:#1D3531;
    --calm:#80B2CF; --sleep:#A7A0DE; --focus:#97C383; --energize:#E3AA60; --meditate:#A9AEB5;
    --warn:#E8B46D; --warn-bg:#2D2316; --danger:#EE8B80;
    --orb-a:#5C9E92; --orb-b:#24534B; --orb-glow:rgba(92,158,146,.18);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1D; --surface-2:#1D2A27; --fg:#E1EAE7; --muted:#93A6A1; --line:#283633;
  --accent:#86C4B8; --accent-ink:#0B1916; --accent-soft:#1D3531;
  --calm:#80B2CF; --sleep:#A7A0DE; --focus:#97C383; --energize:#E3AA60; --meditate:#A9AEB5;
  --warn:#E8B46D; --warn-bg:#2D2316; --danger:#EE8B80;
  --orb-a:#5C9E92; --orb-b:#24534B; --orb-glow:rgba(92,158,146,.18);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
/* The app's own theme choice (Settings) wins over the system */
:root[data-app-theme="light"]{
  --bg:#EDF1EF; --surface:#F9FBFA; --surface-2:#E1E9E6; --fg:#17302B; --muted:#556964; --line:#CCD8D4;
  --accent:#2B6A60; --accent-ink:#F5FBF9; --accent-soft:#D2E6E0;
  --calm:#4A80A1; --sleep:#6861A6; --focus:#57884A; --energize:#AC702A; --meditate:#7A7F86;
  --warn:#8A5212; --warn-bg:#F4E8D4; --danger:#A23A31;
  --orb-a:#A6D6CB; --orb-b:#4C9286; --orb-glow:rgba(76,146,134,.20);
  --scrim:rgba(12,24,22,.45); color-scheme:light;
}
:root[data-app-theme="dark"]{
  --bg:#0E1513; --surface:#151F1D; --surface-2:#1D2A27; --fg:#E1EAE7; --muted:#93A6A1; --line:#283633;
  --accent:#86C4B8; --accent-ink:#0B1916; --accent-soft:#1D3531;
  --calm:#80B2CF; --sleep:#A7A0DE; --focus:#97C383; --energize:#E3AA60; --meditate:#A9AEB5;
  --warn:#E8B46D; --warn-bg:#2D2316; --danger:#EE8B80;
  --orb-a:#5C9E92; --orb-b:#24534B; --orb-glow:rgba(92,158,146,.18);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
p{margin:0}

.app{max-width:34rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;min-height:64px;background:var(--bg)}
.top h1{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1.2;min-width:0}
.wordmark{font-family:var(--f-display);font-size:30px;font-weight:400;margin:0;letter-spacing:.005em}
.wordmark small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-inline-start:8px;letter-spacing:.06em}
.back{flex:none;width:48px;height:48px;margin-inline-start:-10px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center}
.back:hover{background:var(--surface-2)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 10px}
.lede{color:var(--muted);margin:0 0 16px;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:12px}

/* Breathe now */
.bnow{width:100%;min-height:150px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:20px;padding:20px 22px;text-align:start;position:relative;overflow:hidden}
.bnow .mini{flex:none;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 40% 36%,color-mix(in srgb,var(--accent-ink) 55%,transparent),color-mix(in srgb,var(--accent-ink) 10%,transparent) 72%);animation:bn 10s ease-in-out infinite;transform:scale(.6)}
@keyframes bn{0%{transform:scale(.6)}40%{transform:scale(1)}100%{transform:scale(.6)}}
.bnow-title{display:block;font-family:var(--f-display);font-size:33px;line-height:1.08}
.bnow-sub{display:block;font-size:15px;opacity:.88;margin-top:8px;font-variant-numeric:tabular-nums}
.rhythm{display:flex;align-items:baseline;gap:10px;margin-top:14px;color:var(--muted);font-size:15px}
.rhythm strong{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.gentle{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);color:var(--fg);font-size:15px}

/* Need tiles */
.needs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.need{min-height:124px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:3px}
.need:hover,.pcard:hover,.row:hover{border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line))}
.need .dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-bottom:8px}
.need-name{font-family:var(--f-display);font-size:22px;line-height:1.15}
.need-blurb{color:var(--muted);font-size:14px;line-height:1.35}
.c-calm{--c:var(--calm)}.c-sleep{--c:var(--sleep)}.c-focus{--c:var(--focus)}.c-energize{--c:var(--energize)}.c-meditate{--c:var(--meditate)}

/* List rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{min-height:60px;display:flex;align-items:center;gap:14px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:start;width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .r-name{display:block;font-weight:600}
.row small{display:block;color:var(--muted);font-size:13px}
.row svg{flex:none;color:var(--muted)}

/* Buttons */
.btn{min-height:48px;padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-block{width:100%}
.btn-quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:transparent}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}

/* Pattern cards */
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:8px}
.pc-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pc-name{font-family:var(--f-display);font-size:21px;line-height:1.2}
.tone-pick{padding:6px 0 12px;border-top:1px solid var(--line)}
.tone-pick .field-label{padding-top:8px}
.tot{margin-bottom:16px}
.tot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot-tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tot-label{font-size:13px;color:var(--muted);font-weight:600}
.tot-tile b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.tot-tile small{font-size:13px;color:var(--muted)}
.rhythm span[data-notr]{color:var(--muted)}
.pc-tag{color:var(--muted);font-size:15px;line-height:1.4}
.pmeta{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.need-tag{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--fg)}
.tbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;width:100%}
.tbar i{display:block;height:100%}
.tbar .b-in{background:var(--c,var(--accent))}
.tbar .b-hold{background:var(--surface-2)}
.tbar .b-out{background:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--surface-2))}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--sw)}

.note{font-size:14px;color:var(--muted)}
.warnbox{padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.errbox{padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--danger) 50%,var(--line));color:var(--danger);font-size:15px}
.empty{padding:22px 18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s ease}
.sheet.open .sheet-scrim{opacity:1}
.sheet-body{position:relative;width:100%;max-width:34rem;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));transform:translateY(28px);opacity:0;transition:transform .3s ease,opacity .3s ease;display:flex;flex-direction:column;gap:14px}
.sheet.open .sheet-body{transform:none;opacity:1}
.sheet-title{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.dl{display:grid;gap:12px;margin:0}
.dl dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dl dd{margin:2px 0 0}

/* Faces */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{min-height:88px;border:1px solid var(--line);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 2px;line-height:1.2}
.face svg{color:var(--fg)}
.face:hover{border-color:var(--accent)}
.mini-face{display:inline-flex;vertical-align:middle;color:var(--fg)}

/* Steppers & forms */
.field-label{display:block;font-weight:600;margin-bottom:6px}
.textin,.textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px}
.textarea{min-height:110px;resize:vertical;line-height:1.45}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 16px}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) 48px 74px 48px;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.panel>.stepper:first-child{border-top:0}
.st-label{font-weight:500;line-height:1.25}
.st-label small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.sbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.sval{text-align:center;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.sval small{font-size:13px;font-weight:500;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;font-weight:500;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.preview{border-radius:var(--r);background:var(--accent-soft);padding:16px;display:flex;flex-direction:column;gap:10px}
.pv-num{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pv-num .big{font-family:var(--f-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pv-char{font-weight:700;font-size:15px}
.ack{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:10px 0;font-size:15px}
.ack input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--accent)}

/* Settings */
.set-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--line)}
.panel>.set-row:first-child{border-top:0}
.set-row .grow{flex:1;min-width:0}
.set-row small{display:block;color:var(--muted);font-size:13px}
.switch{flex:none;width:58px;height:48px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.switch span{width:50px;height:30px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] span{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"] span::after{transform:translateX(20px);background:var(--accent-ink)}
.range{width:100%;min-height:48px;accent-color:var(--accent)}
.hq{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.panel>.hq:first-child{border-top:0}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-align:center;flex:1}
.iconbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0 8px;letter-spacing:.04em}
.day{min-height:58px;border:0;background:transparent;padding:2px;display:flex}
.day>span{flex:1;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:5px;font-variant-numeric:tabular-nums;font-size:15px}
.day.today>span{box-shadow:inset 0 0 0 2px var(--accent)}
.day.has>span{font-weight:600}
.day:disabled{opacity:1}
.day:disabled>span{background:transparent;color:var(--muted)}
.dots{display:flex;gap:3px;align-items:center;height:10px;font-size:11px;line-height:1;color:var(--muted);font-weight:700}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filter .chip{flex:none}
.honest{margin-top:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.honest .fixed{color:var(--muted);font-size:14px}
.ses{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.ses:first-of-type{border-top:0}
.ses-top{display:flex;gap:10px;align-items:baseline}
.ses-time{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.ses-name{font-weight:600}
.ses-meta,.ses-mood{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ses-note{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Session screen */
.session{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background-color .8s ease,color .8s ease;overflow:hidden}
.session.dim{background:var(--dim-bg);color:var(--dim-fg)}
.s-modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.session .chip{min-height:48px;padding:0 14px;font-size:14px;background:transparent}
.session.dim .chip{border-color:var(--dim-line);color:var(--dim-fg)}
.session.dim .chip[aria-pressed="true"]{background:#0B1312;border-color:#22302D}
.s-note{text-align:center;font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
.session.dim .s-note{color:var(--dim-fg)}
.s-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
.orb-wrap{position:relative;width:min(74vw,42vh,320px);aspect-ratio:1;max-width:100%}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 42% 38%,var(--orb-a),var(--orb-b));box-shadow:0 0 70px 12px var(--orb-glow);transform:scale(.5);will-change:transform}
.session.dim .orb{background:radial-gradient(circle at 42% 38%,var(--dim-orb-a),var(--dim-orb-b));box-shadow:none}
.ring{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:1.2}
.ring-track{stroke:var(--line);opacity:.0}
.ring-arc{stroke:var(--accent);stroke-linecap:round;opacity:0}
.rm .ring-track,.rm .ring-arc{opacity:1}
.session.dim .ring-arc{stroke:var(--dim-fg)}
.session.dim .ring-track{stroke:var(--dim-line)}
.s-count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:64px;color:var(--fg);pointer-events:none}
.session.dim .s-count{color:var(--dim-fg)}
.s-phase{font-family:var(--f-display);font-size:32px;margin-top:26px;text-align:center;min-height:42px;line-height:1.25}
.s-secs{font-size:22px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;min-height:32px}
.session.dim .s-secs{color:var(--dim-fg)}
.s-sound{font-size:18px;color:var(--muted);text-align:center}
.s-foot{display:flex;flex-direction:column;align-items:center;gap:10px}
.s-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.session.dim .s-time,.session.dim .s-hint{color:var(--dim-fg)}
.s-actions{display:flex;gap:10px;width:100%;max-width:26rem}
.s-actions .btn{flex:1;min-height:56px;font-size:17px}
.session .btn{background:transparent}
.session .btn-stop{border-color:color-mix(in srgb,var(--fg) 30%,var(--line))}
.session.dim .btn{border-color:var(--dim-line);color:var(--dim-fg)}
.s-hint{font-size:13px;color:var(--muted);text-align:center}
.s-vol{width:100%;max-width:26rem;display:flex;flex-direction:column;gap:2px;padding:8px 14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.sv-row{display:flex;flex-direction:column;font-size:14px;color:var(--muted)}
.sv-row .range{min-height:40px}
.session.dim .s-vol{background:#070b0a;border-color:var(--dim-line)}
.session.dim .sv-row{color:var(--dim-fg)}
.session.dim .range{accent-color:#3c5a54}
.session .btn[aria-expanded="true"]{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.inf{font-size:1.35em;line-height:1;font-weight:600}
[data-r="start-open"] .inf{margin-inline-end:8px}
.s-msg{position:absolute;inset:0;z-index:2;background:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px;text-align:center;border:0;color:inherit;width:100%}
.s-msg p{font-family:var(--f-display);font-size:30px;line-height:1.25;max-width:20ch}
.s-msg .s-msg-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:22rem}
.s-msg .btn{min-height:56px;font-size:17px}
.session .s-msg .btn-primary{background:var(--accent);color:var(--accent-ink)}
.session.dim .s-msg .btn-primary{background:#132623;color:#8FB3AB;border-color:transparent}
.lp{position:fixed;z-index:70;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:3px solid var(--accent);opacity:0;transform:scale(.35);pointer-events:none}
.lp.on{animation:lp 1s linear forwards}
@keyframes lp{from{opacity:.15;transform:scale(.35)}to{opacity:.9;transform:scale(1)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
[aria-pressed="true"]>.radio{border-color:var(--accent)}
[aria-pressed="true"]>.radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.snd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.panel>.snd:first-child{border-top:0}
.snd-pick{flex:1 1 180px;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:start;padding:4px 0}
.snd-pick .grow{flex:1;min-width:0}
.snd-pick small{display:block;color:var(--muted);font-size:13px}
.snd-play{min-width:84px}
.snd-play[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.snd-extra{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding-block:2px 12px;padding-inline:34px 0;min-width:0}
.num{max-width:8rem}
.inline{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:15px}
.remind{margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;font-size:15px}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:recp 1.2s ease-in-out infinite}
@keyframes recp{50%{opacity:.3}}
.s-msg p.s-sub{font-family:var(--f-body);font-size:19px;line-height:1.4;color:var(--muted);max-width:28ch}
.session.dim .s-msg p.s-sub{color:var(--dim-fg)}
.sheet .rows .row[aria-pressed="true"]{background:var(--accent-soft)}
label.btn{cursor:pointer}
.jcard{margin-top:14px;padding:16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--surface);display:flex;flex-direction:column;gap:10px}
.j-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.j-name{font-family:var(--f-display);font-size:20px}
.j-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.jdots{display:flex;gap:4px}
.jdots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.jdots i.on{background:var(--c)}
.jdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.jday{display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:10px;background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.jday b{font-size:11px;font-weight:600;color:var(--muted)}
.jday.done{background:color-mix(in srgb,var(--c) 20%,var(--bg));color:var(--fg)}
.steps{margin:0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px;font-size:17px}
.ga-box{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ga-big{font-family:var(--f-display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.ga-hit{width:100%;min-height:120px;font-size:22px;border-radius:24px}
.chart{margin:0;display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.g-grid{stroke:var(--line);stroke-width:1}
.g-ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.g-val{fill:var(--fg);font-size:11px;font-weight:600;font-family:var(--f-body)}
.g-bar{fill:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.g-bar.now{fill:var(--accent)}
.tnum{font-variant-numeric:tabular-nums;font-weight:600}
[dir="rtl"] .switch[aria-checked="true"] span::after{transform:translateX(-20px)}
[dir="rtl"] .row>svg,[dir="rtl"] .back svg,[dir="rtl"] .iconbtn svg{transform:scaleX(-1)}
[dir="rtl"] *{letter-spacing:0!important}
[dir="rtl"] .eyebrow{font-size:13px}
[dir="rtl"] body{line-height:1.6}
.s-time,.ses-time{unicode-bidi:plaintext}
.chart svg{direction:ltr}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .bnow .mini{animation:none;transform:scale(.8)}
  .lp.on{animation:none;opacity:.8;transform:scale(1)}
}
@media (max-width:370px){
  .bnow{gap:14px;padding:18px}
  .bnow .mini{width:70px;height:70px}
  .bnow-title{font-size:29px}
}

eminder appears in the app.":"لا يستطيع هذا المتصفح عرض الإشعارات هنا. على iPhone، أضف Nafas إلى الشاشة الرئيسية أولاً. عندما يكون Nafas مفتوحاً في الوقت الذي اخترته، يظهر التذكير داخل التطبيق.","Notifications are blocked for Nafas. You can allow them in your phone’s settings. When Nafas is open at your chosen time, the reminder appears in the app.":"الإشعارات محظورة لـ Nafas. يمكنك السماح بها من إعدادات هاتفك. عندما يكون Nafas مفتوحاً في الوقت الذي اخترته، يظهر التذكير داخل التطبيق.","Notifications are allowed.":"الإشعارات مسموح بها.","Nafas will ask to send notifications when you turn the reminder on.":"سيطلب Nafas إذناً بإرسال الإشعارات عند تفعيل التذكير.","Send a test reminder":"أرسل تذكيراً تجريبياً","Notifications were not allowed. The reminder will appear in the app when it is open.":"لم يُسمح بالإشعارات. سيظهر التذكير داخل التطبيق عندما يكون مفتوحاً.","Test sent. If nothing appeared, notifications may be blocked on this phone.":"أُرسل التذكير التجريبي. إذا لم يظهر شيء، فقد تكون الإشعارات محظورة على هذا الهاتف.","every day":"كل يوم","weekdays":"أيام العمل","no days chosen":"لم تُختر أيام","Automatic":"تلقائي","Phone language: {0}":"لغة الهاتف: {0}","Remove":"إزالة","Remove this language from this phone?":"إزالة هذه اللغة من هذا الهاتف؟","Add another language":"أضف لغة أخرى","Choose your language and Nafas asks Claude to translate the app into it. It downloads once, then works offline. Automatic translations can contain mistakes, so read safety messages with care.":"اختر لغتك وسيطلب Nafas من Claude ترجمة التطبيق إليها. تُحمَّل مرة واحدة ثم تعمل دون اتصال. قد تحتوي الترجمات الآلية على أخطاء، لذا اقرأ رسائل السلامة بعناية.","Find a language":"ابحث عن لغة","Search by name":"ابحث بالاسم","Not in the list?":"غير موجودة في القائمة؟","Type the language name":"اكتب اسم اللغة","Add":"إضافة","Download":"تحميل","No language in the list matches. Type its name below instead.":"لا توجد لغة مطابقة في القائمة. اكتب اسمها في الأسفل.","Translating into":"جارٍ الترجمة إلى","Part {0} of {1}":"الجزء {0} من {1}","Identifying the language":"جارٍ التعرّف على اللغة","Language added":"تمت إضافة اللغة","Language removed":"تمت إزالة اللغة","Adding languages works in the Claude app version of Nafas. Add the language there, then move it here with Export and Import.":"تعمل إضافة اللغات في نسخة Nafas داخل تطبيق Claude. أضف اللغة هناك، ثم انقلها إلى هنا بالتصدير والاستيراد.","Nafas was not allowed to ask Claude, so nothing was downloaded.":"لم يُسمح لـ Nafas بسؤال Claude، لذلك لم يُحمَّل شيء.","Claude is not available for this account, so languages cannot be added here.":"Claude غير متاح لهذا الحساب، لذلك لا يمكن إضافة لغات هنا.","Claude is busy right now. Try again in a few minutes.":"Claude مشغول الآن. حاول مجدداً بعد بضع دقائق.","Sign in to Claude again, then try once more.":"سجّل الدخول إلى Claude مجدداً، ثم حاول مرة أخرى.","The translation came back incomplete. Try again.":"وصلت الترجمة ناقصة. حاول مجدداً.","Claude could not translate into this language.":"لم يستطع Claude الترجمة إلى هذه اللغة.","The download stopped. Check your connection and try again.":"توقف التحميل. تحقّق من اتصالك وحاول مجدداً.","Nafas could not identify that language. Check the spelling or choose one from the list.":"لم يتعرّف Nafas على هذه اللغة. تحقّق من الكتابة أو اختر لغة من القائمة.","Part of the translation is missing, so some text stays in English. You can remove the language and download it again.":"جزء من الترجمة مفقود، لذلك يبقى بعض النص بالإنجليزية. يمكنك إزالة اللغة وتحميلها مجدداً.","English":"الإنجليزية","Arabic":"العربية","French":"الفرنسية","Portuguese":"البرتغالية","Spanish":"الإسبانية","Moroccan Arabic (Darija)":"الدارجة المغربية","Standard Moroccan Tamazight":"الأمازيغية المغربية المعيارية","Kabyle":"القبائلية","German":"الألمانية","Italian":"الإيطالية","Dutch":"الهولندية","Turkish":"التركية","Russian":"الروسية","Ukrainian":"الأوكرانية","Polish":"البولندية","Romanian":"الرومانية","Greek":"اليونانية","Swedish":"السويدية","Danish":"الدنماركية","Norwegian":"النرويجية","Finnish":"الفنلندية","Czech":"التشيكية","Hungarian":"المجرية","Catalan":"الكتالونية","Persian":"الفارسية","Urdu":"الأردية","Hebrew":"العبرية","Hindi":"الهندية","Bengali":"البنغالية","Indonesian":"الإندونيسية","Malay":"الماليزية","Filipino":"الفلبينية","Swahili":"السواحيلية","Amharic":"الأمهرية","Hausa":"الهوسا","Yoruba":"اليوروبا","Wolof":"الولوفية","Somali":"الصومالية","Chinese (Simplified)":"الصينية (المبسّطة)","Japanese":"اليابانية","Korean":"الكورية","Vietnamese":"الفيتنامية","Thai":"التايلاندية","How to do it":"طريقة الممارسة","A gentle rhythm where the out-breath is longer.":"إيقاع لطيف يكون فيه الزفير أطول.","Breathe in through your nose for 4 seconds, then out slowly for 6 seconds, through your nose or softly parted lips. Let the out-breath be relaxed, not forced. Making the exhale longer than the inhale is one of the simplest slow-breathing patterns taught in relaxation programs.":"خذ شهيقاً من أنفك لمدة 4 ثوانٍ، ثم أخرج الزفير ببطء لمدة 6 ثوانٍ من أنفك أو من شفتين منفرجتين قليلاً. اجعل الزفير مسترخياً دون ضغط. جعل الزفير أطول من الشهيق من أبسط أنماط التنفّس البطيء التي تُعلَّم في برامج الاسترخاء.","Even, slow breaths at about five and a half per minute.":"أنفاس بطيئة ومتساوية، بنحو خمسة أنفاس ونصف في الدقيقة.","Breathe in and out through your nose, 5.5 seconds each way, with no pauses. Keep the breath smooth and quiet, mostly into the belly. The name was coined by Stephen Elliott. A similar slow pace of about 5 to 6 breaths per minute is often called resonance breathing.":"تنفّس شهيقاً وزفيراً من أنفك، 5,5 ثانية لكل منهما، دون توقف. اجعل النفَس سلساً وهادئاً، وفي البطن أساساً. صاغ هذا الاسم ستيفن إليوت. ويُسمّى الإيقاع البطيء المشابه، بنحو 5 إلى 6 أنفاس في الدقيقة، غالباً «تنفّس الرنين».","Two inhales through the nose, one long exhale.":"شهيقان من الأنف وزفير واحد طويل.","Breathe in through your nose, then take a second short sip of air to fill your lungs fully. Let it all out slowly through your mouth. Researchers at Stanford studied this pattern, also called cyclic sighing or the physiological sigh, in a 2023 study of daily breathing practice.":"خذ شهيقاً من أنفك، ثم رشفة هواء ثانية قصيرة لتملأ رئتيك تماماً. أخرج الهواء كله ببطء من فمك. درس باحثون في جامعة ستانفورد هذا النمط، ويُسمّى أيضاً التنهّد الدوري أو التنهيدة الفسيولوجية، في دراسة عام 2023 عن ممارسة التنفّس اليومية.","A slow count with a long hold and a long exhale.":"عدّ بطيء مع حبس طويل وزفير طويل.","Breathe in quietly through your nose for 4 seconds, hold gently for 7, then breathe out through your mouth for 8 with a soft whooshing sound. The pattern was popularized by Dr. Andrew Weil, drawing on yogic breathing. If the hold feels long, duplicate the pattern and shorten all three counts.":"خذ شهيقاً هادئاً من أنفك لمدة 4 ثوانٍ، واحبس النفَس برفق لمدة 7، ثم أخرج الزفير من فمك لمدة 8 مع صوت نفخ خفيف. نشر هذا النمط الطبيب أندرو ويل استناداً إلى تنفّس اليوغا. إذا شعرت بأن الحبس طويل، انسخ النمط وقصّر الأعداد الثلاثة.","The out-breath grows slowly, minute by minute.":"يطول الزفير ببطء، دقيقة بعد دقيقة.","Start with even breaths, 4 seconds in and 4 out. Each minute the exhale grows by half a second, up to 8 seconds, so your breathing slows down gradually and without effort. Follow the tone and let the change happen on its own.":"ابدأ بأنفاس متساوية، 4 ثوانٍ شهيقاً و4 زفيراً. كل دقيقة يطول الزفير نصف ثانية حتى 8 ثوانٍ، فيتباطأ تنفّسك تدريجياً ودون جهد. اتبع النغمة ودع التغيير يحدث من تلقاء نفسه.","Four equal sides: in, hold, out, hold.":"أربعة أضلاع متساوية: شهيق، حبس، زفير، حبس.","Breathe in for 4 seconds, hold for 4, breathe out for 4, hold for 4, and repeat. Picture tracing the four sides of a square. Box breathing is widely taught in military and first-responder training as a way to stay steady under pressure.":"خذ شهيقاً لمدة 4 ثوانٍ، واحبس 4، وأخرج الزفير 4، واحبس 4، ثم كرّر. تخيّل أنك ترسم أضلاع مربع الأربعة. يُعلَّم التنفّس المربّع على نطاق واسع في تدريب العسكريين وفرق الطوارئ كوسيلة للحفاظ على الثبات تحت الضغط.","Quick, even breaths for a short lift.":"أنفاس سريعة ومتساوية لدفعة نشاط قصيرة.","Sit upright. Breathe in and out through your nose at a brisk, even pace, 2 seconds each way, for no more than two minutes. Keep it light rather than forceful. Afterwards, breathe naturally for a minute before you stand up.":"اجلس معتدلاً. تنفّس شهيقاً وزفيراً من أنفك بإيقاع سريع ومنتظم، ثانيتين لكل منهما، لمدة لا تتجاوز دقيقتين. اجعله خفيفاً لا قوياً. بعد ذلك تنفّس بشكل طبيعي لمدة دقيقة قبل أن تقف.","One-to-Two Breathing":"التنفّس واحد إلى اثنين","The exhale lasts twice as long as the inhale.":"يستمر الزفير ضعف مدة الشهيق.","Breathe in through your nose for 4 seconds and out for 8. The 1:2 ratio is a classic pattern from yoga and is common in relaxation training. Let the exhale be slow and steady rather than pushed. If 8 seconds feels like a stretch, practice Long Exhale first.":"خذ شهيقاً من أنفك لمدة 4 ثوانٍ وأخرج الزفير لمدة 8. نسبة 1 إلى 2 نمط كلاسيكي من اليوغا وشائع في تدريبات الاسترخاء. اجعل الزفير بطيئاً ومنتظماً دون دفع. إذا شعرت بأن 8 ثوانٍ طويلة، فتمرّن على الزفير الطويل أولاً.","People who are comfortable with Long Exhale and want a slower rhythm.":"من اعتاد على الزفير الطويل ويريد إيقاعاً أبطأ.","If you feel short of air, return to Long Exhale.":"إذا شعرت بضيق في النفَس، عُد إلى الزفير الطويل.","Pursed-Lip Breathing":"التنفّس بالشفتين المزمومتين","In through the nose, out slowly through pursed lips.":"شهيق من الأنف وزفير بطيء من شفتين مزمومتين.","Breathe in through your nose for 2 seconds. Purse your lips as if to blow out a candle, and breathe out gently for 4 seconds. Lung health organizations teach this technique as a simple way to slow your breathing, for example after climbing stairs.":"خذ شهيقاً من أنفك لمدة ثانيتين. اجمع شفتيك كأنك تطفئ شمعة، وأخرج الزفير برفق لمدة 4 ثوانٍ. تُعلّم منظمات صحة الرئة هذه الطريقة كوسيلة بسيطة لإبطاء التنفّس، مثلاً بعد صعود الدرج.","Slowing your breathing after effort, such as stairs or a brisk walk.":"إبطاء التنفّس بعد مجهود، مثل صعود الدرج أو المشي السريع.","Do not force the air out. If you have a lung condition, follow the advice of your own care team.":"لا تدفع الهواء بقوة. إذا كان لديك مرض في الرئة، فاتبع نصائح الفريق الذي يتابع حالتك.","Humming Bee Breath":"نفَس النحلة الطنّانة","A soft hum on every out-breath.":"همهمة خفيفة مع كل زفير.","Breathe in through your nose for 5 seconds. Then, with your mouth closed, breathe out for 8 seconds while making a low, steady hum, like a bee. You can rest your fingertips over your ears to feel the vibration. In yoga this practice is called Bhramari.":"خذ شهيقاً من أنفك لمدة 5 ثوانٍ. ثم، وفمك مغلق، أخرج الزفير لمدة 8 ثوانٍ مع همهمة منخفضة ومتصلة مثل طنين النحلة. يمكنك وضع أطراف أصابعك على أذنيك لتشعر بالاهتزاز. تُسمّى هذه الممارسة في اليوغا «بهراماري».","Winding down in the evening, somewhere you can hum without disturbing anyone.":"الاسترخاء في المساء، في مكان يمكنك فيه الهمهمة دون إزعاج أحد.","If your throat is sore, skip the hum and breathe out silently.":"إذا كان حلقك يؤلمك، فتجاوز الهمهمة وأخرج الزفير بصمت.","Triangle Breathing":"التنفّس المثلّث","Three equal sides: in, hold, out.":"ثلاثة أضلاع متساوية: شهيق، حبس، زفير.","Breathe in for 4 seconds, hold gently for 4, and breathe out for 4, then begin again with no pause. It is a gentler version of box breathing, with one hold instead of two. Picture tracing the three sides of a triangle.":"خذ شهيقاً لمدة 4 ثوانٍ، واحبس برفق 4، وأخرج الزفير 4، ثم ابدأ من جديد دون توقف. هو نسخة ألطف من التنفّس المربّع، بحبس واحد بدل اثنين. تخيّل أنك ترسم أضلاع مثلث الثلاثة.","A calm, regular count before sleep, and a gentle step towards Box Breathing.":"عدّ هادئ ومنتظم قبل النوم، وخطوة لطيفة نحو التنفّس المربّع.","If holding feels uncomfortable, use Lengthening Exhale instead.":"إذا كان حبس النفس غير مريح، فاستخدم الزفير المتدرّج بدلاً منه.","Equal Breathing":"التنفّس المتساوي","Inhale and exhale of the same length.":"شهيق وزفير بالطول نفسه.","Breathe in through your nose for 4 seconds and out through your nose for 4. Keep both halves smooth and the same length, without pausing in between. In yoga this is called Sama Vritti, which means equal movement.":"خذ شهيقاً من أنفك لمدة 4 ثوانٍ وأخرج الزفير من أنفك لمدة 4. اجعل النصفين سلسين ومتساويين، دون توقف بينهما. يُسمّى هذا في اليوغا «ساما فريتّي»، أي الحركة المتساوية.","Settling your mind before study or work, at any time of day.":"تهدئة الذهن قبل الدراسة أو العمل، في أي وقت من اليوم.","Alternate Nostril Breathing":"التنفّس بالتناوب بين فتحتي الأنف","Breathe through one nostril at a time.":"تنفّس من فتحة أنف واحدة في كل مرة.","Close your right nostril with your right thumb and breathe in through the left for 5 seconds. Close the left with your ring finger, open the right, and breathe out for 5. Breathe in through the right, switch, and breathe out through the left. Keep alternating. In yoga this is called Nadi Shodhana.":"أغلق فتحة أنفك اليمنى بإبهامك الأيمن وخذ شهيقاً من اليسرى لمدة 5 ثوانٍ. أغلق اليسرى بإصبع البنصر، وافتح اليمنى، وأخرج الزفير لمدة 5. خذ شهيقاً من اليمنى، ثم بدّل، وأخرج الزفير من اليسرى. استمر في التناوب. يُسمّى هذا في اليوغا «نادي شودانا».","A steady, absorbing practice before focused work.":"ممارسة هادئة تشدّ الانتباه قبل العمل المركّز.","If your nose is blocked, use Equal Breathing instead.":"إذا كان أنفك مسدوداً، فاستخدم التنفّس المتساوي بدلاً منه.","Three-Part Breath":"النفَس ثلاثي الأجزاء","Fill the belly, ribs and chest in one long inhale.":"املأ البطن والأضلاع والصدر في شهيق واحد طويل.","Breathe in through your nose for 6 seconds, filling first the belly, then the ribs, then the upper chest. Breathe out for 4 seconds, letting the air go in the reverse order. In yoga this is called Dirga breathing. A longer inhale than exhale gives the breath a more wakeful feel.":"خذ شهيقاً من أنفك لمدة 6 ثوانٍ، واملأ أولاً البطن، ثم الأضلاع، ثم أعلى الصدر. أخرج الزفير لمدة 4 ثوانٍ، ودع الهواء يخرج بالترتيب المعاكس. يُسمّى هذا في اليوغا «ديرغا». الشهيق الأطول من الزفير يمنح النفَس طابعاً أكثر يقظة.","Starting the day or an afternoon slump, sitting or lying down.":"بداية اليوم أو فتور ما بعد الظهر، جالساً أو مستلقياً.","If you feel lightheaded, shorten the inhale or return to natural breathing.":"إذا شعرت بخفّة في الرأس، فقصّر الشهيق أو عُد إلى التنفّس الطبيعي.","Wake-Up Breath":"نفَس الاستيقاظ","A full inhale and a quick, relaxed exhale.":"شهيق كامل وزفير سريع ومسترخٍ.","Breathe in through your nose for 4 seconds, then let the breath fall out in 2 seconds without pushing. Keep your shoulders relaxed. Breathwork teachers use patterns with a longer inhale than exhale to feel more alert, without the fast pace of energizing breaths.":"خذ شهيقاً من أنفك لمدة 4 ثوانٍ، ثم دع النفَس يخرج خلال ثانيتين دون دفع. أبقِ كتفيك مسترخيين. يستخدم معلّمو تمارين التنفّس أنماطاً يكون فيها الشهيق أطول من الزفير للشعور بمزيد من اليقظة، دون الإيقاع السريع لأنفاس التنشيط.","A gentle lift when you feel sluggish, without fast breathing.":"دفعة لطيفة عندما تشعر بالخمول، دون تنفّس سريع.","If you feel lightheaded, stop and breathe naturally.":"إذا شعرت بخفّة في الرأس، توقّف وتنفّس بشكل طبيعي.","Tone style":"نوع النغمة","Hear":"استمع","Hear {0}":"استمع إلى {0}","Pure tone with a gentle fifth":"نغمة صافية مع خامسة هادئة","Warm":"دافئة","Mellow and low, like a soft organ":"رخيمة ومنخفضة، كأرغن هادئ","Flute":"ناي","Airy and light, with a slight waver":"هوائية وخفيفة، مع تموّج بسيط","Deep":"عميقة","A low hum you feel more than hear":"طنين منخفض تشعر به أكثر مما تسمعه","Crystal":"كريستال","Bright and glassy, like a singing bowl":"صافية ولامعة، كوعاء غنائي","Ocean":"محيط","No pitch: a wave that rises and falls":"دون نغمة: موجة تعلو وتنخفض","Session in progress":"جلسة جارية","Android sends this reminder as a notification, even when Nafas is closed. Allow notifications when asked.":"يرسل أندرويد هذا التذكير كإشعار، حتى عندما يكون Nafas مغلقاً. اسمح بالإشعارات عندما يُطلب منك ذلك.","Breath":"نفَس","Sounds like a soft breath in and out":"يشبه صوت شهيق وزفير هادئين","Time reached":"انتهى الوقت المحدد","say:Time reached":"انتهى الوقت المحدد","{0} · Time reache ian":"Russe","Ukrainian":"Ukrainien","Polish":"Polonais","Romanian":"Roumain","Greek":"Grec","Swedish":"Suédois","Danish":"Danois","Norwegian":"Norvégien","Finnish":"Finnois","Czech":"Tchèque","Hungarian":"Hongrois","Catalan":"Catalan","Persian":"Persan","Urdu":"Ourdou","Hebrew":"Hébreu","Hindi":"Hindi","Bengali":"Bengali","Indonesian":"Indonésien","Malay":"Malais","Filipino":"Filipino","Swahili":"Swahili","Amharic":"Amharique","Hausa":"Haoussa","Yoruba":"Yoruba","Wolof":"Wolof","Somali":"Somali","Chinese (Simplified)":"Chinois (simplifié)","Japanese":"Japonais","Korean":"Coréen","Vietnamese":"Vietnamien","Thai":"Thaï","How to do it":"Comment faire","A gentle rhythm where the out-breath is longer.":"Un rythme doux où l’expiration est plus longue.","Breathe in through your nose for 4 seconds, then out slowly for 6 seconds, through your nose or softly parted lips. Let the out-breath be relaxed, not forced. Making the exhale longer than the inhale is one of the simplest slow-breathing patterns taught in relaxation programs.":"Inspirez par le nez pendant 4 secondes, puis expirez lentement pendant 6 secondes, par le nez ou les lèvres légèrement entrouvertes. Laissez l’expiration se faire sans forcer. Allonger l’expiration par rapport à l’inspiration est l’un des exercices de respiration lente les plus simples enseignés dans les programmes de relaxation.","Even, slow breaths at about five and a half per minute.":"Des respirations lentes et égales, environ cinq et demie par minute.","Breathe in and out through your nose, 5.5 seconds each way, with no pauses. Keep the breath smooth and quiet, mostly into the belly. The name was coined by Stephen Elliott. A similar slow pace of about 5 to 6 breaths per minute is often called resonance breathing.":"Inspirez et expirez par le nez, 5,5 secondes dans chaque sens, sans pause. Gardez un souffle fluide et silencieux, surtout dans le ventre. Le nom « Coherent Breathing » vient de Stephen Elliott. Un rythme lent proche, de 5 à 6 respirations par minute, est souvent appelé respiration de résonance.","Two inhales through the nose, one long exhale.":"Deux inspirations par le nez, une longue expiration.","Breathe in through your nose, then take a second short sip of air to fill your lungs fully. Let it all out slowly through your mouth. Researchers at Stanford studied this pattern, also called cyclic sighing or the physiological sigh, in a 2023 study of daily breathing practice.":"Inspirez par le nez, puis prenez une seconde petite gorgée d’air pour remplir complètement vos poumons. Relâchez tout lentement par la bouche. Des chercheurs de Stanford ont étudié cet exercice, aussi appelé soupir cyclique ou soupir physiologique, dans une étude de 2023 sur la pratique quotidienne de la respiration.","A slow count with a long hold and a long exhale.":"Un compte lent avec une longue rétention et une longue expiration.","Breathe in quietly through your nose for 4 seconds, hold gently for 7, then breathe out through your mouth for 8 with a soft whooshing sound. The pattern was popularized by Dr. Andrew Weil, drawing on yogic breathing. If the hold feels long, duplicate the pattern and shorten all three counts.":"Inspirez doucement par le nez pendant 4 secondes, retenez sans forcer pendant 7, puis expirez par la bouche pendant 8 avec un léger souffle. Cet exercice a été popularisé par le Dr Andrew Weil, qui s’inspire de la respiration yogique. Si la rétention vous semble longue, dupliquez l’exercice et raccourcissez les trois temps.","The out-breath grows slowly, minute by minute.":"L’expiration s’allonge doucement, minute après minute.","Start with even breaths, 4 seconds in and 4 out. Each minute the exhale grows by half a second, up to 8 seconds, so your breathing slows down gradually and without effort. Follow the tone and let the change happen on its own.":"Commencez par des respirations égales, 4 secondes d’inspiration et 4 d’expiration. Chaque minute, l’expiration s’allonge d’une demi-seconde, jusqu’à 8 secondes : votre respiration ralentit peu à peu, sans effort. Suivez le son et laissez le changement se faire.","Four equal sides: in, hold, out, hold.":"Quatre côtés égaux : inspirer, retenir, expirer, retenir.","Breathe in for 4 seconds, hold for 4, breathe out for 4, hold for 4, and repeat. Picture tracing the four sides of a square. Box breathing is widely taught in military and first-responder training as a way to stay steady under pressure.":"Inspirez pendant 4 secondes, retenez 4, expirez 4, retenez 4, puis recommencez. Imaginez que vous tracez les quatre côtés d’un carré. La respiration carrée est largement enseignée aux militaires et aux secouristes pour rester stable sous pression.","Quick, even breaths for a short lift.":"Des respirations rapides et égales pour un petit regain.","Sit upright. Breathe in and out through your nose at a brisk, even pace, 2 seconds each way, for no more than two minutes. Keep it light rather than forceful. Afterwards, breathe naturally for a minute before you stand up.":"Asseyez-vous bien droit. Inspirez et expirez par le nez à un rythme vif et régulier, 2 secondes dans chaque sens, pendant deux minutes au plus. Restez léger plutôt que de forcer. Ensuite, respirez naturellement pendant une minute avant de vous lever.","One-to-Two Breathing":"Respiration un pour deux","The exhale lasts twice as long as the inhale.":"L’expiration dure deux fois plus longtemps que l’inspiration.","Breathe in through your nose for 4 seconds and out for 8. The 1:2 ratio is a classic pattern from yoga and is common in relaxation training. Let the exhale be slow and steady rather than pushed. If 8 seconds feels like a stretch, practice Long Exhale first.":"Inspirez par le nez pendant 4 secondes et expirez pendant 8. Le rapport 1:2 est un classique du yoga, courant dans les entraînements à la relaxation. Laissez l’expiration lente et régulière, sans pousser. Si 8 secondes vous semblent longues, pratiquez d’abord l’Expiration longue.","People who are comfortable with Long Exhale and want a slower rhythm.":"Les personnes à l’aise avec l’Expiration longue qui veulent un rythme plus lent.","If you feel short of air, return to Long Exhale.":"Si vous manquez d’air, revenez à l’Expiration longue.","Pursed-Lip Breathing":"Respiration lèvres pincées","In through the nose, out slowly through pursed lips.":"Inspirer par le nez, expirer lentement lèvres pincées.","Breathe in through your nose for 2 seconds. Purse your lips as if to blow out a candle, and breathe out gently for 4 seconds. Lung health organizations teach this technique as a simple way to slow your breathing, for example after climbing stairs.":"Inspirez par le nez pendant 2 secondes. Pincez les lèvres comme pour souffler une bougie, puis expirez doucement pendant 4 secondes. Les organismes de santé respiratoire enseignent cette technique comme un moyen simple de ralentir la respiration, par exemple après avoir monté des escaliers.","Slowing your breathing after effort, such as stairs or a brisk walk.":"Ralentir la respiration après un effort, comme des escaliers ou une marche rapide.","Do not force the air out. If you have a lung condition, follow the advice of your own care team.":"Ne forcez pas pour expirer. Si vous avez un problème pulmonaire, suivez les conseils de votre équipe soignante.","Humming Bee Breath":"Respiration de l’abeille","A soft hum on every out-breath.":"Un léger bourdonnement à chaque expiration.","Breathe in through your nose for 5 seconds. Then, with your mouth closed, breathe out for 8 seconds while making a low, steady hum, like a bee. You can rest your fingertips over your ears to feel the vibration. In yoga this practice is called Bhramari.":"Inspirez par le nez pendant 5 secondes. Puis, bouche fermée, expirez pendant 8 secondes en faisant un bourdonnement grave et régulier, comme une abeille. Vous pouvez poser le bout des doigts sur vos oreilles pour sentir la vibration. Dans le yoga, cette pratique s’appelle Bhramari.","Winding down in the evening, somewhere you can hum without disturbing anyone.":"Se détendre le soir, dans un endroit où vous pouvez bourdonner sans déranger personne.","If your throat is sore, skip the hum and breathe out silently.":"Si vous avez mal à la gorge, laissez de côté le bourdonnement et expirez en silence.","Triangle Breathing":"Respiration triangulaire","Three equal sides: in, hold, out.":"Trois côtés égaux : inspirer, retenir, expirer.","Breathe in for 4 seconds, hold gently for 4, and breathe out for 4, then begin again with no pause. It is a gentler version of box breathing, with one hold instead of two. Picture tracing the three sides of a triangle.":"Inspirez pendant 4 secondes, retenez doucement 4, expirez 4, puis recommencez sans pause. C’est une version plus douce de la respiration carrée, avec une seule rétention au lieu de deux. Imaginez que vous tracez les trois côtés d’un triangle.","A calm, regular count before sleep, and a gentle step towards Box Breathing.":"Un compte calme et régulier avant de dormir, et une étape en douceur vers la respiration carrée.","If holding feels uncomfortable, use Lengthening Exhale instead.":"Si la rétention est inconfortable, utilisez plutôt l’Expiration progressive.","Equal Breathing":"Respiration égale","Inhale and exhale of the same length.":"Inspiration et expiration de même durée.","Breathe in through your nose for 4 seconds and out through your nose for 4. Keep both halves smooth and the same length, without pausing in between. In yoga this is called Sama Vritti, which means equal movement.":"Inspirez par le nez pendant 4 secondes et expirez par le nez pendant 4. Gardez les deux moitiés fluides et de même durée, sans pause entre elles. Dans le yoga, on l’appelle Sama Vritti, ce qui signifie mouvement égal.","Settling your mind before study or work, at any time of day.":"Poser l’esprit avant d’étudier ou de travailler, à tout moment de la journée.","Alternate Nostril Breathing":"Respiration alternée","Breathe through one nostril at a time.":"Respirer par une narine à la fois.","Close your right nostril with your right thumb and breathe in through the left for 5 seconds. Close the left with your ring finger, open the right, and breathe out for 5. Breathe in through the right, switch, and breathe out through the left. Keep alternating. In yoga this is called Nadi Shodhana.":"Fermez la narine droite avec le pouce droit et inspirez par la gauche pendant 5 secondes. Fermez la gauche avec l’annulaire, ouvrez la droite et expirez pendant 5. Inspirez par la droite, changez, puis expirez par la gauche. Continuez en alternant. Dans le yoga, on l’appelle Nadi Shodhana.","A steady, absorbing practice before focused work.":"Une pratique régulière et absorbante avant un travail concentré.","If your nose is blocked, use Equal Breathing instead.":"Si votre nez est bouché, utilisez plutôt la Respiration égale.","Three-Part Breath":"Respiration en trois temps","Fill the belly, ribs and chest in one long inhale.":"Remplir le ventre, les côtes et la poitrine en une longue inspiration.","Breathe in through your nose for 6 seconds, filling first the belly, then the ribs, then the upper chest. Breathe out for 4 seconds, letting the air go in the reverse order. In yoga this is called Dirga breathing. A longer inhale than exhale gives the breath a more wakeful feel.":"Inspirez par le nez pendant 6 secondes en remplissant d’abord le ventre, puis les côtes, puis le haut de la poitrine. Expirez pendant 4 secondes en laissant l’air sortir dans l’ordre inverse. Dans le yoga, on l’appelle respiration Dirga. Une inspiration plus longue que l’expiration donne au souffle un caractère plus éveillé.","Starting the day or an afternoon slump, sitting or lying down.":"Pour commencer la journée ou lors d’un coup de fatigue l’après-midi, assis ou allongé.","If you feel lightheaded, shorten the inhale or return to natural breathing.":"Si vous êtes étourdi, raccourcissez l’inspiration ou revenez à une respiration naturelle.","Wake-Up Breath":"Respiration du réveil","A full inhale and a quick, relaxed exhale.":"Une inspiration pleine et une expiration rapide et détendue.","Breathe in through your nose for 4 seconds, then let the breath fall out in 2 seconds without pushing. Keep your shoulders relaxed. Breathwork teachers use patterns with a longer inhale than exhale to feel more alert, without the fast pace of energizing breaths.":"Inspirez par le nez pendant 4 secondes, puis laissez l’air sortir en 2 secondes sans pousser. Gardez les épaules détendues. Les enseignants de respiration utilisent des exercices où l’inspiration est plus longue que l’expiration pour se sentir plus alerte, sans le rythme rapide des respirations énergisantes.","A gentle lift when you feel sluggish, without fast breathing.":"Un regain en douceur quand vous vous sentez ralenti, sans respiration rapide.","If you feel lightheaded, stop and breathe naturally.":"Si vous êtes étourdi, arrêtez et respirez naturellement.","Tone style":"Style de son","Hear":"Écouter","Hear {0}":"Écouter {0}","Pure tone with a gentle fifth":"Son pur avec une quinte douce","Warm":"Chaleureux","Mellow and low, like a soft organ":"Doux et grave, comme un orgue feutré","Flute":"Flûte","Airy and light, with a slight waver":"Aérien et léger, avec un léger vibrato","Deep":"Grave","A low hum you feel more than hear":"Un bourdonnement grave qu’on sent plus qu’on n’entend","Crystal":"Cristal","Bright and glassy, like a singing bowl":"Clair et cristallin, comme un bol chantant","Ocean":"Océan","No pitch: a wave that rises and falls":"Sans note : une vague qui monte et descend","Session in progress":"Séance en cours","Android sends this reminder as a notification, even when Nafas is closed. Allow notifications when asked.":"Android envoie ce rappel sous forme de notification, même quand Nafas est fermé. Autorisez les notifications quand on vous le demande.","Breath":"Souffle","Sounds like a soft breath in and out":"Comme le bruit d’une i n iPhone, add Nafas to your home screen first. When Nafas is open at your chosen time, the reminder appears in the app.":"Este navegador não pode mostrar notificações aqui. No iPhone, adicione o Nafas à tela de início primeiro. Quando o Nafas estiver aberto no horário escolhido, o lembrete aparece no app.","Notifications are blocked for Nafas. You can allow them in your phone’s settings. When Nafas is open at your chosen time, the reminder appears in the app.":"As notificações estão bloqueadas para o Nafas. Você pode permiti-las nas configurações do telefone. Quando o Nafas estiver aberto no horário escolhido, o lembrete aparece no app.","Notifications are allowed.":"As notificações estão permitidas.","Nafas will ask to send notifications when you turn the reminder on.":"O Nafas vai pedir permissão para enviar notificações quando você ativar o lembrete.","Send a test reminder":"Enviar um lembrete de teste","Notifications were not allowed. The reminder will appear in the app when it is open.":"As notificações não foram permitidas. O lembrete aparecerá no app quando ele estiver aberto.","Test sent. If nothing appeared, notifications may be blocked on this phone.":"Teste enviado. Se nada apareceu, as notificações podem estar bloqueadas neste telefone.","every day":"todos os dias","weekdays":"dias úteis","no days chosen":"nenhum dia escolhido","Automatic":"Automático","Phone language: {0}":"Idioma do telefone: {0}","Remove":"Remover","Remove this language from this phone?":"Remover este idioma deste telefone?","Add another language":"Adicionar outro idioma","Choose your language and Nafas asks Claude to translate the app into it. It downloads once, then works offline. Automatic translations can contain mistakes, so read safety messages with care.":"Escolha seu idioma e o Nafas pede ao Claude para traduzir o app. Ele é baixado uma vez e depois funciona offline. Traduções automáticas podem ter erros, então leia as mensagens de segurança com atenção.","Find a language":"Encontrar um idioma","Search by name":"Pesquisar pelo nome","Not in the list?":"Não está na lista?","Type the language name":"Digite o nome do idioma","Add":"Adicionar","Download":"Baixar","No language in the list matches. Type its name below instead.":"Nenhum idioma da lista corresponde. Digite o nome abaixo.","Translating into":"Traduzindo para","Part {0} of {1}":"Parte {0} de {1}","Identifying the language":"Identificando o idioma","Language added":"Idioma adicionado","Language removed":"Idioma removido","Adding languages works in the Claude app version of Nafas. Add the language there, then move it here with Export and Import.":"Adicionar idiomas funciona na versão do Nafas aberta no app do Claude. Adicione o idioma lá e depois traga-o para cá com Exportar e Importar.","Nafas was not allowed to ask Claude, so nothing was downloaded.":"O Nafas não teve permissão para perguntar ao Claude, então nada foi baixado.","Claude is not available for this account, so languages cannot be added here.":"O Claude não está disponível para esta conta, então não é possível adicionar idiomas aqui.","Claude is busy right now. Try again in a few minutes.":"O Claude está ocupado agora. Tente de novo em alguns minutos.","Sign in to Claude again, then try once more.":"Entre no Claude novamente e tente outra vez.","The translation came back incomplete. Try again.":"A tradução voltou incompleta. Tente de novo.","Claude could not translate into this language.":"O Claude não conseguiu traduzir para este idioma.","The download stopped. Check your connection and try again.":"O download parou. Verifique sua conexão e tente de novo.","Nafas could not identify that language. Check the spelling or choose one from the list.":"O Nafas não identificou esse idioma. Confira a grafia ou escolha um da lista.","Part of the translation is missing, so some text stays in English. You can remove the language and download it again.":"Parte da tradução está faltando, então alguns textos ficam em inglês. Você pode remover o idioma e baixá-lo de novo.","English":"Inglês","Arabic":"Árabe","French":"Francês","Portuguese":"Português","Spanish":"Espanhol","Moroccan Arabic (Darija)":"Árabe marroquino (dárija)","Standard Moroccan Tamazight":"Tamazight marroquino padrão","Kabyle":"Cabila","German":"Alemão","Italian":"Italiano","Dutch":"Holandês","Turkish":"Turco","Russian":"Russo","Ukrainian":"Ucraniano","Polish":"Polonês","Romanian":"Romeno","Greek":"Grego","Swedish":"Sueco","Danish":"Dinamarquês","Norwegian":"Norueguês","Finnish":"Finlandês","Czech":"Tcheco","Hungarian":"Húngaro","Catalan":"Catalão","Persian":"Persa","Urdu":"Urdu","Hebrew":"Hebraico","Hindi":"Hindi","Bengali":"Bengali","Indonesian":"Indonésio","Malay":"Malaio","Filipino":"Filipino","Swahili":"Suaíli","Amharic":"Amárico","Hausa":"Hauçá","Yoruba":"Iorubá","Wolof":"Uolofe","Somali":"Somali","Chinese (Simplified)":"Chinês (simplificado)","Japanese":"Japonês","Korean":"Coreano","Vietnamese":"Vietnamita","Thai":"Tailandês","How to do it":"Como fazer","A gentle rhythm where the out-breath is longer.":"Um ritmo suave em que a expiração é mais longa.","Breathe in through your nose for 4 seconds, then out slowly for 6 seconds, through your nose or softly parted lips. Let the out-breath be relaxed, not forced. Making the exhale longer than the inhale is one of the simplest slow-breathing patterns taught in relaxation programs.":"Inspire pelo nariz por 4 segundos e depois expire devagar por 6 segundos, pelo nariz ou com os lábios levemente entreabertos. Deixe a expiração relaxada, sem forçar. Tornar a expiração mais longa que a inspiração é um dos padrões de respiração lenta mais simples ensinados em programas de relaxamento.","Even, slow breaths at about five and a half per minute.":"Respirações lentas e iguais, cerca de cinco e meia por minuto.","Breathe in and out through your nose, 5.5 seconds each way, with no pauses. Keep the breath smooth and quiet, mostly into the belly. The name was coined by Stephen Elliott. A similar slow pace of about 5 to 6 breaths per minute is often called resonance breathing.":"Inspire e expire pelo nariz, 5,5 segundos em cada direção, sem pausas. Mantenha a respiração suave e silenciosa, principalmente na barriga. O nome foi criado por Stephen Elliott. Um ritmo lento parecido, de 5 a 6 respirações por minuto, costuma ser chamado de respiração de ressonância.","Two inhales through the nose, one long exhale.":"Duas inspirações pelo nariz, uma expiração longa.","Breathe in through your nose, then take a second short sip of air to fill your lungs fully. Let it all out slowly through your mouth. Researchers at Stanford studied this pattern, also called cyclic sighing or the physiological sigh, in a 2023 study of daily breathing practice.":"Inspire pelo nariz e depois dê um segundo gole curto de ar para encher totalmente os pulmões. Solte tudo devagar pela boca. Pesquisadores de Stanford estudaram este padrão, também chamado de suspiro cíclico ou suspiro fisiológico, em um estudo de 2023 sobre a prática diária de respiração.","A slow count with a long hold and a long exhale.":"Uma contagem lenta com pausa longa e expiração longa.","Breathe in quietly through your nose for 4 seconds, hold gently for 7, then breathe out through your mouth for 8 with a soft whooshing sound. The pattern was popularized by Dr. Andrew Weil, drawing on yogic breathing. If the hold feels long, duplicate the pattern and shorten all three counts.":"Inspire em silêncio pelo nariz por 4 segundos, segure com suavidade por 7 e expire pela boca por 8, com um leve sopro. O padrão foi popularizado pelo Dr. Andrew Weil, com base na respiração do yoga. Se a pausa parecer longa, duplique o padrão e encurte os três tempos.","The out-breath grows slowly, minute by minute.":"A expiração aumenta devagar, minuto a minuto.","Start with even breaths, 4 seconds in and 4 out. Each minute the exhale grows by half a second, up to 8 seconds, so your breathing slows down gradually and without effort. Follow the tone and let the change happen on its own.":"Comece com respirações iguais, 4 segundos inspirando e 4 expirando. A cada minuto a expiração aumenta meio segundo, até 8 segundos, e a respiração vai ficando mais lenta aos poucos, sem esforço. Siga o tom e deixe a mudança acontecer sozinha.","Four equal sides: in, hold, out, hold.":"Quatro lados iguais: inspirar, segurar, expirar, segurar.","Breathe in for 4 seconds, hold for 4, breathe out for 4, hold for 4, and repeat. Picture tracing the four sides of a square. Box breathing is widely taught in military and first-responder training as a way to stay steady under pressure.":"Inspire por 4 segundos, segure por 4, expire por 4, segure por 4 e repita. Imagine que está desenhando os quatro lados de um quadrado. A respiração quadrada é muito ensinada no treinamento militar e de socorristas como forma de manter a firmeza sob pressão.","Quick, even breaths for a short lift.":"Respirações rápidas e iguais para um pequeno estímulo.","Sit upright. Breathe in and out through your nose at a brisk, even pace, 2 seconds each way, for no more than two minutes. Keep it light rather than forceful. Afterwards, breathe naturally for a minute before you stand up.":"Sente-se com a coluna ereta. Inspire e expire pelo nariz num ritmo rápido e regular, 2 segundos em cada direção, por no máximo dois minutos. Mantenha a respiração leve, sem força. Depois, respire normalmente por um minuto antes de se levantar.","One-to-Two Breathing":"Respiração um para dois","The exhale lasts twice as long as the inhale.":"A expiração dura o dobro da inspiração.","Breathe in through your nose for 4 seconds and out for 8. The 1:2 ratio is a classic pattern from yoga and is common in relaxation training. Let the exhale be slow and steady rather than pushed. If 8 seconds feels like a stretch, practice Long Exhale first.":"Inspire pelo nariz por 4 segundos e expire por 8. A proporção 1:2 é um padrão clássico do yoga e comum em treinos de relaxamento. Deixe a expiração lenta e constante, sem empurrar. Se 8 segundos parecerem muito, pratique antes a Expiração longa.","People who are comfortable with Long Exhale and want a slower rhythm.":"Quem já está à vontade com a Expiração longa e quer um ritmo mais lento.","If you feel short of air, return to Long Exhale.":"Se sentir falta de ar, volte para a Expiração longa.","Pursed-Lip Breathing":"Respiração com lábios franzidos","In through the nose, out slowly through pursed lips.":"Inspire pelo nariz e expire devagar com os lábios franzidos.","Breathe in through your nose for 2 seconds. Purse your lips as if to blow out a candle, and breathe out gently for 4 seconds. Lung health organizations teach this technique as a simple way to slow your breathing, for example after climbing stairs.":"Inspire pelo nariz por 2 segundos. Franza os lábios como se fosse apagar uma vela e expire suavemente por 4 segundos. Organizações de saúde pulmonar ensinam esta técnica como um jeito simples de desacelerar a respiração, por exemplo depois de subir escadas.","Slowing your breathing after effort, such as stairs or a brisk walk.":"Desacelerar a respiração depois de um esforço, como escadas ou uma caminhada rápida.","Do not force the air out. If you have a lung condition, follow the advice of your own care team.":"Não force o ar para fora. Se você tem alguma condição pulmonar, siga as orientações da sua equipe de saúde.","Humming Bee Breath":"Respiração da abelha","A soft hum on every out-breath.":"Um zumbido suave a cada expiração.","Breathe in through your nose for 5 seconds. Then, with your mouth closed, breathe out for 8 seconds while making a low, steady hum, like a bee. You can rest your fingertips over your ears to feel the vibration. In yoga this practice is called Bhramari.":"Inspire pelo nariz por 5 segundos. Depois, com a boca fechada, expire por 8 segundos fazendo um zumbido grave e contínuo, como uma abelha. Você pode apoiar as pontas dos dedos sobre as orelhas para sentir a vibração. No yoga, esta prática se chama Bhramari.","Winding down in the evening, somewhere you can hum without disturbing anyone.":"Relaxar à noite, num lugar onde você possa zumbir sem incomodar ninguém.","If your throat is sore, skip the hum and breathe out silently.":"Se a garganta estiver dolorida, deixe o zumbido de lado e expire em silêncio.","Triangle Breathing":"Respiração triangular","Three equal sides: in, hold, out.":"Três lados iguais: inspirar, segurar, expirar.","Breathe in for 4 seconds, hold gently for 4, and breathe out for 4, then begin again with no pause. It is a gentler version of box breathing, with one hold instead of two. Picture tracing the three sides of a triangle.":"Inspire por 4 segundos, segure com suavidade por 4, expire por 4 e recomece sem pausa. É uma versão mais suave da respiração quadrada, com uma pausa em vez de duas. Imagine que está desenhando os três lados de um triângulo.","A calm, regular count before sleep, and a gentle step towards Box Breathing.":"Uma contagem calma e regular antes de dormir, e um passo suave rumo à Respiração quadrada.","If holding feels uncomfortable, use Lengthening Exhale instead.":"Se segurar for desconfortável, use a Expiração progressiva.","Equal Breathing":"Respiração igual","Inhale and exhale of the same length.":"Inspiração e expiração com a mesma duração.","Breathe in through your nose for 4 seconds and out through your nose for 4. Keep both halves smooth and the same length, without pausing in between. In yoga this is called Sama Vritti, which means equal movement.":"Inspire pelo nariz por 4 segundos e expire pelo nariz por 4. Mantenha as duas metades suaves e com a mesma duração, sem pausa entre elas. No yoga, isso se chama Sama Vritti, que significa movimento igual.","Settling your mind before study or work, at any time of day.":"Acalmar a mente antes de estudar ou trabalhar, a qualquer hora do dia.","Alternate Nostril Breathing":"Respiração alternada pelas narinas","Breathe through one nostril at a time.":"Respire por uma narina de cada vez.","Close your right nostril with your right thumb and breathe in through the left for 5 seconds. Close the left with your ring finger, open the right, and breathe out for 5. Breathe in through the right, switch, and breathe out through the left. Keep alternating. In yoga this is called Nadi Shodhana.":"Feche a narina direita com o polegar direito e inspire pela esquerda por 5 segundos. Feche a esquerda com o dedo anelar, abra a direita e expire por 5. Inspire pela direita, troque e expire pela esquerda. Continue alternando. No yoga, isso se chama Nadi Shodhana.","A steady, absorbing practice before focused work.":"Uma prática constante e envolvente antes de um trabalho concentrado.","If your nose is blocked, use Equal Breathing instead.":"Se o nariz estiver entupido, use a Respiração igual.","Three-Part Breath":"Respiração em três partes","Fill the belly, ribs and chest in one long inhale.":"Encha a barriga, as costelas e o peito numa inspiração longa.","Breathe in through your nose for 6 seconds, filling first the belly, then the ribs, then the upper chest. Breathe out for 4 seconds, letting the air go in the reverse order. In yoga this is called Dirga breathing. A longer inhale than exhale gives the breath a more wakeful feel.":"Inspire pelo nariz por 6 segundos, enchendo primeiro a barriga, depois as costelas e por fim a parte de cima do peito. Expire por 4 segundos, soltando o ar na ordem inversa. No yoga, isso se chama respiração Dirga. Uma inspiração mais longa que a expiração dá à respiração um caráter mais desperto.","Starting the day or an afternoon slump, sitting or lying down.":"Para começar o dia ou numa queda de energia à tarde, sentado ou deitado.","If you feel lightheaded, shorten the inhale or return to natural breathing.":"Se sentir a cabeça leve, encurte a inspiração ou volte à respiração natural.","Wake-Up Breath":"Respiração para despertar","A full inhale and a quick, relaxed exhale.":"Uma inspiração completa e uma expiração rápida e relaxada.","Breathe in through your nose for 4 seconds, then let the breath fall out in 2 seconds without pushing. Keep your shoulders relaxed. Breathwork teachers use patterns with a longer inhale than exhale to feel more alert, without the fast pace of energizing breaths.":"Inspire pelo nariz por 4 segundos e depois deixe o ar sair em 2 segundos, sem empurrar. Mantenha os ombros relaxados. Professores de respiração usam padrões com a inspiração mais longa que a expiração para se sentir mais alerta, sem o ritmo acelerado das respirações energizantes.","A gentle lift when you feel sluggish, without fast breathing.":"Um estímulo suave quando você se sente lento, sem respiração rápida.","If you feel lightheaded, stop and breathe naturally.":"Se sentir a cabeça leve, pare e respire normalmente.","Tone style":"Estilo do tom","Hear":"Ouvir","Hear {0}":"Ouvir {0}","Pure tone with a gentle fifth":"Tom puro com uma quinta suave","Warm":"Quente","Mellow and low, like a soft organ":"Suave e grave, como um órgão macio","Flute":"Flauta","Airy and light, with a slight waver":"Leve e arejado, com uma leve ondulação","Deep":"Profundo","A low hum you feel more than hear":"Um zumbido grave que se sente mais do que se ouve","Crystal":"Cristal","Bright and glassy, like a singing bowl":"Brilhante e cristalino, como uma tigela tibetana","Ocean":"Oceano","No pitch: a wave that rises and falls":"Sem nota: uma onda que sobe e desce","Session in progress":"Sessão em andamento","Android sends this reminder as a notification, even when Nafas is closed. Allow notifications when asked.":"O Android envia este lembrete como notificação, mesmo com o Nafas fechado. Permita as notificações quando for solicitado.","Breath":"Respiração","Sounds like a soft breath in and out":"Como o som de uma inspiração e expiração suaves","Time reached":"Tempo previsto atingido","say:Time reached":"O tempo previsto terminou","{0} · Time reached":"{0} · tempo previsto atingido","The
