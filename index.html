ve the language and download it again.":"Falta parte de la traducción, así que algunos textos quedan en inglés. Puedes quitar el idioma y descargarlo de nuevo.","English":"Inglés","Arabic":"Árabe","French":"Francés","Portuguese":"Portugués","Spanish":"Español","Moroccan Arabic (Darija)":"Árabe marroquí (dariya)","Standard Moroccan Tamazight":"Tamazight marroquí estándar","Kabyle":"Cabilio","German":"Alemán","Italian":"Italiano","Dutch":"Neerlandés","Turkish":"Turco","Russian":"Ruso","Ukrainian":"Ucraniano","Polish":"Polaco","Romanian":"Rumano","Greek":"Griego","Swedish":"Sueco","Danish":"Danés","Norwegian":"Noruego","Finnish":"Finés","Czech":"Checo","Hungarian":"Húngaro","Catalan":"Catalán","Persian":"Persa","Urdu":"Urdu","Hebrew":"Hebreo","Hindi":"Hindi","Bengali":"Bengalí","Indonesian":"Indonesio","Malay":"Malayo","Filipino":"Filipino","Swahili":"Suajili","Amharic":"Amhárico","Hausa":"Hausa","Yoruba":"Yoruba","Wolof":"Wolof","Somali":"Somalí","Chinese (Simplified)":"Chino (simplificado)","Japanese":"Japonés","Korean":"Coreano","Vietnamese":"Vietnamita","Thai":"Tailandés","How to do it":"Cómo hacerlo","A gentle rhythm where the out-breath is longer.":"Un ritmo suave en el que la exhalación es más larga.","Breathe in through your nose for 4 seconds, then out slowly for 6 seconds, through your nose or softly parted lips. Let the out-breath be relaxed, not forced. Making the exhale longer than the inhale is one of the simplest slow-breathing patterns taught in relaxation programs.":"Inhala por la nariz durante 4 segundos y luego exhala despacio durante 6 segundos, por la nariz o con los labios ligeramente separados. Deja que la exhalación sea relajada, sin forzar. Alargar la exhalación respecto a la inhalación es uno de los patrones de respiración lenta más sencillos que se enseñan en programas de relajación.","Even, slow breaths at about five and a half per minute.":"Respiraciones lentas y parejas, unas cinco y media por minuto.","Breathe in and out through your nose, 5.5 seconds each way, with no pauses. Keep the breath smooth and quiet, mostly into the belly. The name was coined by Stephen Elliott. A similar slow pace of about 5 to 6 breaths per minute is often called resonance breathing.":"Inhala y exhala por la nariz, 5,5 segundos en cada sentido, sin pausas. Mantén la respiración suave y silenciosa, sobre todo en el abdomen. El nombre lo acuñó Stephen Elliott. Un ritmo lento parecido, de 5 a 6 respiraciones por minuto, suele llamarse respiración de resonancia.","Two inhales through the nose, one long exhale.":"Dos inhalaciones por la nariz, una exhalación larga.","Breathe in through your nose, then take a second short sip of air to fill your lungs fully. Let it all out slowly through your mouth. Researchers at Stanford studied this pattern, also called cyclic sighing or the physiological sigh, in a 2023 study of daily breathing practice.":"Inhala por la nariz y luego toma un segundo sorbo corto de aire para llenar del todo los pulmones. Suéltalo todo despacio por la boca. Investigadores de Stanford estudiaron este patrón, también llamado suspiro cíclico o suspiro fisiológico, en un estudio de 2023 sobre la práctica diaria de respiración.","A slow count with a long hold and a long exhale.":"Una cuenta lenta con una retención larga y una exhalación larga.","Breathe in quietly through your nose for 4 seconds, hold gently for 7, then breathe out through your mouth for 8 with a soft whooshing sound. The pattern was popularized by Dr. Andrew Weil, drawing on yogic breathing. If the hold feels long, duplicate the pattern and shorten all three counts.":"Inhala en silencio por la nariz durante 4 segundos, mantén con suavidad durante 7 y exhala por la boca durante 8 con un leve soplido. El patrón lo popularizó el Dr. Andrew Weil, inspirándose en la respiración del yoga. Si la retención se te hace larga, duplica el patrón y acorta los tres tiempos.","The out-breath grows slowly, minute by minute.":"La exhalación crece despacio, minuto a minuto.","Start with even breaths, 4 seconds in and 4 out. Each minute the exhale grows by half a second, up to 8 seconds, so your breathing slows down gradually and without effort. Follow the tone and let the change happen on its own.":"Empieza con respiraciones iguales, 4 segundos al inhalar y 4 al exhalar. Cada minuto la exhalación crece medio segundo, hasta 8 segundos, y tu respiración se va haciendo más lenta poco a poco y sin esfuerzo. Sigue el tono y deja que el cambio ocurra solo.","Four equal sides: in, hold, out, hold.":"Cuatro lados iguales: inhalar, retener, exhalar, retener.","Breathe in for 4 seconds, hold for 4, breathe out for 4, hold for 4, and repeat. Picture tracing the four sides of a square. Box breathing is widely taught in military and first-responder training as a way to stay steady under pressure.":"Inhala durante 4 segundos, retén 4, exhala 4, retén 4 y repite. Imagina que recorres los cuatro lados de un cuadrado. La respiración cuadrada se enseña mucho en la formación militar y de equipos de emergencia para mantener la calma bajo presión.","Quick, even breaths for a short lift.":"Respiraciones rápidas y parejas para un pequeño impulso.","Sit upright. Breathe in and out through your nose at a brisk, even pace, 2 seconds each way, for no more than two minutes. Keep it light rather than forceful. Afterwards, breathe naturally for a minute before you stand up.":"Siéntate erguido. Inhala y exhala por la nariz a un ritmo ágil y regular, 2 segundos en cada sentido, durante dos minutos como máximo. Mantenlo ligero, sin forzar. Después, respira con naturalidad un minuto antes de ponerte de pie.","One-to-Two Breathing":"Respiración uno a dos","The exhale lasts twice as long as the inhale.":"La exhalación dura el doble que la inhalación.","Breathe in through your nose for 4 seconds and out for 8. The 1:2 ratio is a classic pattern from yoga and is common in relaxation training. Let the exhale be slow and steady rather than pushed. If 8 seconds feels like a stretch, practice Long Exhale first.":"Inhala por la nariz durante 4 segundos y exhala durante 8. La proporción 1:2 es un patrón clásico del yoga, habitual en el entrenamiento de relajación. Deja que la exhalación sea lenta y constante, sin empujar. Si 8 segundos se te hacen largos, practica antes la Exhalación larga.","People who are comfortable with Long Exhale and want a slower rhythm.":"Quien ya se siente cómodo con la Exhalación larga y quiere un ritmo más lento.","If you feel short of air, return to Long Exhale.":"Si te falta el aire, vuelve a la Exhalación larga.","Pursed-Lip Breathing":"Respiración con labios fruncidos","In through the nose, out slowly through pursed lips.":"Inhala por la nariz y exhala despacio con los labios fruncidos.","Breathe in through your nose for 2 seconds. Purse your lips as if to blow out a candle, and breathe out gently for 4 seconds. Lung health organizations teach this technique as a simple way to slow your breathing, for example after climbing stairs.":"Inhala por la nariz durante 2 segundos. Frunce los labios como para apagar una vela y exhala suavemente durante 4 segundos. Las organizaciones de salud pulmonar enseñan esta técnica como una forma sencilla de hacer más lenta la respiración, por ejemplo después de subir escaleras.","Slowing your breathing after effort, such as stairs or a brisk walk.":"Hacer más lenta la respiración después de un esfuerzo, como escaleras o una caminata rápida.","Do not force the air out. If you have a lung condition, follow the advice of your own care team.":"No fuerces la salida del aire. Si tienes una afección pulmonar, sigue las indicaciones de tu equipo de salud.","Humming Bee Breath":"Respiración de la abeja","A soft hum on every out-breath.":"Un zumbido suave en cada exhalación.","Breathe in through your nose for 5 seconds. Then, with your mouth closed, breathe out for 8 seconds while making a low, steady hum, like a bee. You can rest your fingertips over your ears to feel the vibration. In yoga this practice is called Bhramari.":"Inhala por la nariz durante 5 segundos. Luego, con la boca cerrada, exhala durante 8 segundos haciendo un zumbido grave y continuo, como una abeja. Puedes apoyar las yemas de los dedos sobre las orejas para sentir la vibración. En el yoga, esta práctica se llama Bhramari.","Winding down in the evening, somewhere you can hum without disturbing anyone.":"Relajarse por la noche, en un lugar donde puedas zumbar sin molestar a nadie.","If your throat is sore, skip the hum and breathe out silently.":"Si te duele la garganta, omite el zumbido y exhala en silencio.","Triangle Breathing":"Respiración triangular","Three equal sides: in, hold, out.":"Tres lados iguales: inhalar, retener, exhalar.","Breathe in for 4 seconds, hold gently for 4, and breathe out for 4, then begin again with no pause. It is a gentler version of box breathing, with one hold instead of two. Picture tracing the three sides of a triangle.":"Inhala durante 4 segundos, retén con suavidad 4, exhala 4 y vuelve a empezar sin pausa. Es una versión más suave de la respiración cuadrada, con una retención en lugar de dos. Imagina que recorres los tres lados de un triángulo.","A calm, regular count before sleep, and a gentle step towards Box Breathing.":"Una cuenta tranquila y regular antes de dormir, y un paso suave hacia la Respiración cuadrada.","If holding feels uncomfortable, use Lengthening Exhale instead.":"Si retener te resulta incómodo, usa la Exhalación progresiva.","Equal Breathing":"Respiración igualada","Inhale and exhale of the same length.":"Inhalación y exhalación de la misma duración.","Breathe in through your nose for 4 seconds and out through your nose for 4. Keep both halves smooth and the same length, without pausing in between. In yoga this is called Sama Vritti, which means equal movement.":"Inhala por la nariz durante 4 segundos y exhala por la nariz durante 4. Mantén ambas mitades suaves y de la misma duración, sin pausa entre ellas. En el yoga se llama Sama Vritti, que significa movimiento igual.","Settling your mind before study or work, at any time of day.":"Asentar la mente antes de estudiar o trabajar, a cualquier hora del día.","Alternate Nostril Breathing":"Respiración alterna por las fosas nasales","Breathe through one nostril at a time.":"Respira por una fosa nasal cada vez.","Close your right nostril with your right thumb and breathe in through the left for 5 seconds. Close the left with your ring finger, open the right, and breathe out for 5. Breathe in through the right, switch, and breathe out through the left. Keep alternating. In yoga this is called Nadi Shodhana.":"Cierra la fosa nasal derecha con el pulgar derecho e inhala por la izquierda durante 5 segundos. Cierra la izquierda con el anular, abre la derecha y exhala durante 5. Inhala por la derecha, cambia y exhala por la izquierda. Sigue alternando. En el yoga se llama Nadi Shodhana.","A steady, absorbing practice before focused work.":"Una práctica constante y absorbente antes de un trabajo concentrado.","If your nose is blocked, use Equal Breathing instead.":"Si tienes la nariz tapada, usa la Respiración igualada.","Three-Part Breath":"Respiración en tres partes","Fill the belly, ribs and chest in one long inhale.":"Llena el abdomen, las costillas y el pecho en una inhalación larga.","Breathe in through your nose for 6 seconds, filling first the belly, then the ribs, then the upper chest. Breathe out for 4 seconds, letting the air go in the reverse order. In yoga this is called Dirga breathing. A longer inhale than exhale gives the breath a more wakeful feel.":"Inhala por la nariz durante 6 segundos, llenando primero el abdomen, luego las costillas y por último la parte alta del pecho. Exhala durante 4 segundos, soltando el aire en orden inverso. En el yoga se llama respiración Dirga. Una inhalación más larga que la exhalación da a la respiración un carácter más despierto.","Starting the day or an afternoon slump, sitting or lying down.":"Para empezar el día o en el bajón de la tarde, sentado o tumbado.","If you feel lightheaded, shorten the inhale or return to natural breathing.":"Si notas la cabeza ligera, acorta la inhalación o vuelve a respirar con naturalidad.","Wake-Up Breath":"Respiración para despertar","A full inhale and a quick, relaxed exhale.":"Una inhalación completa y una exhalación rápida y relajada.","Breathe in through your nose for 4 seconds, then let the breath fall out in 2 seconds without pushing. Keep your shoulders relaxed. Breathwork teachers use patterns with a longer inhale than exhale to feel more alert, without the fast pace of energizing breaths.":"Inhala por la nariz durante 4 segundos y luego deja salir el aire en 2 segundos, sin empujar. Mantén los hombros relajados. Los profesores de respiración usan patrones con una inhalación más larga que la exhalación para sentirse más alerta, sin el ritmo rápido de las respiraciones energizantes.","A gentle lift when you feel sluggish, without fast breathing.":"Un impulso suave cuando te sientes lento, sin respiración rápida.","If you feel lightheaded, stop and breathe naturally.":"Si notas la cabeza ligera, para y respira con naturalidad.","Tone style":"Estilo de tono","Hear":"Escuchar","Hear {0}":"Escuchar {0}","Pure tone with a gentle fifth":"Tono puro con una quinta suave","Warm":"Cálido","Mellow and low, like a soft organ":"Suave y grave, como un órgano tenue","Flute":"Flauta","Airy and light, with a slight waver":"Aéreo y ligero, con una leve ondulación","Deep":"Profundo","A low hum you feel more than hear":"Un zumbido grave que se siente más que se oye","Crystal":"Cristal","Bright and glassy, like a singing bowl":"Brillante y cristalino, como un cuenco cantor","Ocean":"Océano","No pitch: a wave that rises and falls":"Sin nota: una ola que sube y baja","Session in progress":"Sesión en curso","Android sends this reminder as a notification, even when Nafas is closed. Allow notifications when asked.":"Android e const DB = (() => {
  let db = null;
  const STORES = ['sessions', 'patterns', 'kv', 'audio', 'voice', 'gauge'];
  const mem = { sessions: new Map(), patterns: new Map(), kv: new Map(), audio: new Map(), voice: new Map(), gauge: new Map() };
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('nafas', 3);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['sessions', 'patterns', 'audio', 'voice', 'gauge'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => res(false);
      r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
  const all = store => new Promise(res => {
    if (!db) return res([...mem[store].values()]);
    try { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }
    catch (e) { res([...mem[store].values()]); }
  });
  const get = (store, id) => new Promise(res => {
    if (!db) return res(mem[store].get(id));
    try { const r = db.transaction(store).objectStore(store).get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }
    catch (e) { res(mem[store].get(id)); }

    catch (e) { mem[store].set(obj.id ?? obj.k, obj); res(); }
  });
  const del = (store, id) => new Promise(res => {
    mem[store].delete(id);
    if (!db) return res();
    try { const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(id); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch (e) { res(); }
  });
  const clear = () => new Promise(res => {
    Object.values(mem).forEach(m => m.clear());
    if (!db) return res();

const B64 = {

}

/* ---------- Comfortable Pace Finder ---------- */
const PACES = [6.5, 6, 5.5, 5, 4.5];
const COMFORT = { 3: 'Comfortable', 2: 'Okay', 1: 'Strained' };
function buildPace() {
  const phases = [], segs = []; let t = 0, c = 0;
  PACES.forEach(bpm => {
    const half = Math.round(60 / bpm / 2 * 100) / 100, cl = half * 2, start = t;
    while (t - start <= 120 - cl * 0.5 - 1e-6) {
      phases.push({ k: 'in', t, d: half, c }); t += half;
      phases.push({ k: 'out', t, d: half, c }); t += half; c++;
    }
    segs.push({ bpm, start, end: t });
  });
  return { phases, segs, total: t };
}
function runPace(moodBefore) {
  const b = buildPace();
  baseSession({
    kind: 'pace', phases: b.phases, segs: b.segs, total: b.total, segIdx: 0, segEnd: b.segs[0].end,
    ratings: PACES.map(() => null), moodBefore, quick: false, bgSpec: null,
    p: { id: 'pace-finder', name: 'Comfortable Pace Finder', need: 'calm', t: mkT({ in: 4.6, out: 4.6 }) },
    modes: { ...settings.modes }
  });
}
function paceBreak() {
  S.activeSec += segPlayed();
  S.state = 'rating'; clearInterval(S.iv);
  vibrate([30, 90, 30]);
  const k = S.segIdx, seg = S.segs[k];
  showMsg('How comfortable was it?', [['Comfortable', 'pace-r', false, 3], ['Okay', 'pace-r', false, 2], ['Strained', 'pace-r', false, 1], ['Skip', 'pace-r', false, 0]],
    false, `Pace ${k + 1} of ${S.segs.length}: ${fmt1(seg.bpm)} breaths per minute`);
}
function paceRate(v) {
  if (!S.on || S.state !== 'rating') return;
  S.ratings[S.segIdx] = v || null;
  S.segIdx++;
  if (S.segIdx >= S.segs.length) { finish(true); return; }
  S.segEnd = S.segs[S.segIdx].end;
  ensureAudioThen(() => startRun(S.segs[S.segIdx].start));
}
function paceResult(ratings) {
  const rated = ratings.map((r, i) => ({ r, bpm: PACES[i] })).filter(x => x.r);
  if (!rated.length) return { best: [], text: 'You did not rate any pace, so there is no result this time.' };
  const top = Math.max(...rated.map(x => x.r));
  const best = rated.filter(x => x.r === top).map(x => x.bpm);
  const list = best.map(fmt1);
  const joined = listJoin(list);
  return { best, text: best.length === 1 ? `The pace that felt most comfortable to you: ${joined} breaths per minute` : `The paces that felt most comfortable to you: ${joined} breaths per minute` };
}
async function savePace(bpm) {
  const half = Math.round(60 / bpm / 2 * 10) / 10;
  const p = { id: uid(), builtin: false, need: 'calm', name: t('My comfortable pace ({0})', fmt1(bpm)), t: mkT({ in: half, out: half }), len: { mode: 'min', v: 5 }, basedOn: 'Comfortable Pace Finder', updated: Date.now() };
  await DB.put('patterns', p); userPatterns.push(p);
  return p;
}

/* ---------- Calm Gauge ---------- */
let gauges = [];
const GA = { phase: 'idle', t0: 0, sec: 0, iv: 0, nodes: [] };

function gaugeTick() {
  const e = $('#ga-big');

    const left = 60 - (performance.now() - GA.t0) / 1000;
    if (left <= 0) { gaugeStop(); GA.phase = 'ready'; vibrate(40); render(); return; }
    if (e) e.textContent = mmss(left);
  } else if (GA.phase === 'hold') {
    const s = (performance.now() - GA.t0) / 1000;
    if (s >= 120) { gaugeFinish(true); return; }
    if (e) e.textContent = t('{0} s', Math.floor(s));
  }
}
function gaugeMinute() {
  GA.phase = 'minute'; GA.t0 = performance.now();
  withAudio(() => { GA.nodes.push(...BELL_VARIANT.interval(AC.currentTime + 60)); }); // a quiet bell at the end of the minute, scheduled on the audio clock
  clearInterval(GA.iv); GA.iv = setInterval(gaugeTick, 200);
  render();
}
function gaugeStart() { gaugeStop(); GA.phase = 'hold'; GA.t0 = performance.now(); GA.iv = setInterval(gaugeTick, 100); render(); }

  gaugeStop();
  const g = { id: uid(), date: new Date().toISOString(), day: dayKey(new Date()), sec, capped: !!capped };
  await DB.put('gauge', g); gauges.push(g);
  GA.phase = 'done'; GA.sec = sec; GA.capped = !!capped;
  render();
}
function gaugeChart() {
  const ws = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const cur = ws(new Date()), weeks = [];
  for (let i = 7; i >= 0; i--) { const w = new Date(cur); w.setDate(cur.getDate() - i * 7); weeks.push({ start: w, key: dayKey(w), vals: [] }); }
  gauges.forEach(g => { const k = dayKey(ws(new Date(g.date))); const w = weeks.find(x => x.key === k); if (w) w.vals.push(g.sec); });
  weeks.forEach(w => { w.avg = w.vals.length ? Math.round(w.vals.reduce((a, b) => a + b, 0) / w.vals.length) : null; });
  const max = Math.max(10, ...weeks.map(w => w.avg || 0));
  const top = Math.ceil(max * 1.15 / 5) * 5;
  const W = 320, H = 170, L = 26, B = 24, T = 16, bw = (W - L) / 8;
  const y = v => T + (H - T - B) * (1 - v / top);
  const grid = [0, top / 2, top].map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="g-grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="g-ax">${Math.round(v)}</text>`).join('');
  const bars = weeks.map((w, i) => {
    const x = L + i * bw + bw * 0.2, wd = bw * 0.6, lab = w.start.toLocaleDateString(LOC(), { month: 'short', day: 'numeric' });
    const bar = w.avg != null ? `<rect x="${x}" y="${y(w.avg)}" width="${wd}" height="${Math.max(1, y(0) - y(w.avg))}" rx="3" class="g-bar${i === 7 ? ' now' : ''}"/><text x="${x + wd / 2}" y="${y(w.avg) - 5}" text-anchor="middle" class="g-val">${w.avg}</text>` : '';
    return `${bar}<text x="${x + wd / 2}" y="${H - 6}" text-anchor="middle" class="g-ax">${lab.replace(' ', ' ')}</text>`;
  }).join('');
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly average of your Calm Gauge results, in seconds, for the last eight weeks">${grid}${bars}</svg>
    <figcaption class="note">Average seconds per week, last eight weeks. Weeks without a result are left empty.</figcaption></figure>`;
}
V.gauge = () => {

/* ---------- Gentle reminder ---------- */
const REM_TEXT = "Time for a short breath, if you'd like.";
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
let SWREG = null, REMT = 0;
const REM = { msg: '' };
function remSupport() {
  if (NA) return 'android';
  if (window.self !== window.top) return 'frame';
  if (!('Notification' in window)) return 'none';
  if (Notification.permission === 'denied') return 'denied';
  return 'ok';
}
const isoDow = d => (d.getDay() + 6) % 7 + 1;
function remAt(d) { const [h, m] = settings.reminder.time.split(':').map(Number); const x = new Date(d); x.setHours(h || 0, m || 0, 0, 0); return x; }
function nextReminder(from = Date.now()) {
  const r = settings.reminder; if (!r.on || !r.days.length) return null;
  for (let i = 0; i < 8; i++) { const d = new Date(from); d.setDate(d.getDate() + i); const at = remAt(d); if (at.getTime() > from && r.days.includes(isoDow(at))) return at.getTime(); }
  return null;
}
function remSummary() {
  const r = settings.reminder;
  if (!r.on) return t('Off');
  const days = r.days.length === 7 ? t('every day') : r.days.length === 5 && !r.days.includes(6) && !r.days.includes(7) ? t('weekdays') : r.days.slice().sort().map(d => t(DOW[d - 1])).join(', ');
  return `${fmtTime(r.time)}, ${days || t('no days chosen')}`;
}
function fmtTime(t) { const [h, m] = t.split(':').map(Number); const d = new Date(2026, 0, 1, h, m); return d.toLocaleTimeString(LOC(), { hour: 'numeric', minute: '2-digit' }); }
function remBannerDue() {
  const r = settings.reminder; if (!r.on) return false;
  const now = new Date(), today = dayKey(now);
  if (!r.days.includes(isoDow(now)) || settings.remDismissed === today) return false;
  const at = remAt(now);
  if (now < at || now - at > 2 * 3600e3) return false;
  return !sessions.some(s => dayKey(new Date(s.start)) === today && new Date(s.start) >= at);
}
async function showReminderNotice() {
  if (NA) { try { NA.testReminder('Nafas', tr(REM_TEXT)); } catch (e) {} return; }
  try {
    if (remSupport() === 'ok' && Notification.permission === 'granted') {
      const reg = SWREG || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
      if (reg) await reg.showNotification('Nafas', { body: REM_TEXT, tag: 'nafas-reminder', icon: 'icon-192.png', badge: 'icon-192.png' });
      else new Notification('Nafas', { body: REM_TEXT, tag: 'nafas-reminder' });
    }
  } catch (e) {}
  if (!S.on && top().name === 'home') render();
}
async function syncReminder() {
  if (NA) { try { const r = settings.reminder; NA.setReminder(JSON.stringify({ on: !!r.on, time: r.time, days: r.days, title: 'Nafas', text: tr(REM_TEXT) })); } catch (e) {} return; }
  clearTimeout(REMT);
  const r = settings.reminder;
  try {
    const reg = SWREG || (remSupport() !== 'frame' && navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    if (reg) {
      const w = reg.active || reg.waiting || reg.installing;
      if (w) w.postMessage({ type: 'reminder', cfg: { on: r.on, time: r.time, days: r.days, text: REM_TEXT } });
      if (reg.periodicSync) {
        if (r.on) { try { const st = await navigator.permissions.query({ name: 'periodic-background-sync' }); if (st.state === 'granted') await reg.periodicSync.register('nafas-reminder', { minInterval: 3600e3 }); } catch (e) {} }

      }
      if (window.TimestampTrigger && 'showTrigger' in Notification.prototype && Notification.permission === 'granted') {
        const old = await reg.getNotifications({ includeTriggered: true }).catch(() => []);
        old.forEach(n => { if (n.tag && n.tag.startsWith('nafas-at-')) n.close(); });
        let t = Date.now();
        for (let i = 0; i < 7 && r.on; i++) { const at = nextReminder(t); if (!at) break; await reg.showNotification('Nafas', { body: REM_TEXT, tag: 'nafas-at-' + at, showTrigger: new TimestampTrigger(at), icon: 'icon-192.png' }).catch(() => {}); t = at + 1000; }
      }
    }
  } catch (e) {}

}

  render();
  const strings = {};
  let missing = 0;
  try {
    for (const ch of chunks) {
      LDL.step++; render();
      const items = ch.map(k => {
        const en = DICTS.en[k];
        return en && typeof en === 'object' ? { key: k, plural: true, english_one: fill(en.one || k, ['1']), english_other: fill(en.other || k, ['5']) } : { key: k };
      });
      const prompt = `You are translating the interface of Nafas, a calm breathing and meditation app for phones, from English into ${meta.name}${meta.native && meta.native !== meta.name ? ` (${meta.native})` : ''}.
Rules:
- Natural, short, calm wording for app buttons, labels and messages.
- Keep every placeholder such as {0} and {1} exactly as written, and keep HTML tags such as <strong> exactly.
- Keys that start with "phase:" or "say:" are single words shown or spoken during a breathing session; translate only the part after the colon, as a short calm instruction, and do not include the prefix in the translation.
- Keep the app name "Nafas" as it is. You may use local abbreviations for s (seconds), min (minutes) and Hz.
- Never add praise, encouragement, or medical or therapeutic claims. Safety messages must stay complete and exact in meaning.
- Items with "plural": true show English singular and plural examples; return an object with the keys ${cats.join(', ')} (the CLDR plural categories of this language), each a full translation that uses {0} for the number.
${meta.hint ? '- ' + meta.hint + '\n' : ''}Reply with only one JSON object that maps each "key", exactly as given, to its translation.
Items:
${JSON.stringify(items)}`;
      const res = await sample.json(prompt, { signal: LDL.ctl.signal, cache: { gcTime: 86400000 } });

  render();
  try {
    const info = await sample.json(`Someone using a phone app typed this as the language they want the app in: "${name.replace(/"/g, "'")}". Identify the language. Reply with only JSON: {"name": "its English name", "native": "its name written in that language", "code": "its BCP 47 tag", "dir": "ltr" or "rtl"}. If it is not a language you can translate into well, reply {"error": "unknown"}.`, { modelTier: 'quick', signal: LDL.ctl.signal });
    if (!info || info.error || !info.code || !info.name) { Object.assign(LDL, { busy: false, ctl: null, err: 'Nafas could not identify that language. Check the spelling or choose one from the list.' }); render(); return; }
    let code = String(info.code).trim();
    if (!/^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$/.test(code)) code = 'x-' + String(info.name).toLowerCase().replace(/[^a-z]+/g, '').slice(0, 8);
    if (LANGS[code] || packs[code]) { Object.assign(LDL, { busy: false, ctl: null }); settings.lang = code; await saveSettings(); applyLang(); render(); return; }
    await downloadLang({ code, name: String(info.name).slice(0, 40), native: String(info.native || info.name).slice(0, 40), dir: info.dir === 'rtl' ? 'rtl' : 'ltr', loc: code });
  } catch (e) {
    Object.assign(LDL, { busy: false, steps: 0, ctl: null, err: e && e.code === 'cancelled' ? '' : sampleErr(e && e.code) });
    render();
  }
}
Object.assign(A, {
  'lang-set': async e => { settings.lang = e.dataset.id; LDL.del = null; await saveSettings(); applyLang(); render(); },
  'lang-dl': e => { const m = LANG_LIST.find(l => l.code === e.dataset.id); if (m) { LDL.ctl = new AbortController(); downloadLang(m); } },
  'lang-custom': () => addCustomLang(($('#lang-custom') || {}).value),
  'lang-stop': () => { if (LDL.ctl) LDL.ctl.abort(); },
  'lang-del': e => { LDL.del = e.dataset.id; render(); },
  'lang-del-no': () => { LDL.del = null; render(); },
  'lang-del-yes': async e => {
    const c = e.dataset.id;
    await DB.del('kv', 'lang:' + c); delete packs[c]; LDL.del = null;
    if (settings.lang === c) { settings.lang = 'auto'; await saveSettings(); }
    applyLang(); render(); toast('Language removed');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'lang-q') { LDL.q = e.target.value; const l = $('#lang-list'); if (l) { l.innerHTML = langListHtml(); translateEl(l); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lang-custom') { e.preventDefault(); addCustomLang(e.target.value); } });

document.addEventListener('click', e => {
  if (lpFired) { e.preventDefault(); e.stopPropagation(); return; }
  const r = e.target.closest('[data-r]');
  if (r && sheetBody.contains(r)) { unlockAudio(); closeSheet(r.dataset.r); return; }
  if (e.target.classList.contains('sheet-scrim')) { if (!sheetEl.dataset.locked) closeSheet(null); return; }
  const a = e.target.closest('[data-a]');
  if (!a || a.disabled) return;
  const fn = A[a.dataset.a];
  if (fn) fn(a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheetEl.hidden && !sheetEl.dataset.locked) closeSheet(null);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 's-msg' && S.state === 'gate') { e.preventDefault(); A.gate(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ed-name' && ED) ED.d.name = t.value;
  if (t.id === 'vol-guide') { settings.vol.guide = +t.value; applyVolumes(); saveSettings(); }
  if (t.id === 'vol-bell') { settings.vol.bell = +t.value; applyVolumes(); saveSettings(); }
  if (t.id === 'sv-guide' || t.id === 'sv-bg' || t.id === 'sv-bell') { settings.vol[t.id.slice(3)] = +t.value; applyVolumes(); saveSettings(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'ed-ack' && ED) { ED.ack = e.target.checked; if (ED.ack && ED.err) { ED.err = ''; render(); } }
});

/* ---------- boot ---------- */
function handleHash() {
  if (location.hash === '#now') {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    quickStart();
  }
}
window.addEventListener('hashchange', handleHash);
(async () => {
  await DB.open();
  const kv = await DB.all('kv');
  settings = merge(DEFAULTS, kv.find(x => x.k === 'settings'));
  await loadAll();
  applyLang();
  if (!settings.firstUse) { settings.firstUse = Date.now(); saveSettings(); }
  applyTheme();
  getDownloads();
  registerSW();
  syncReminder();
  stack = [rootView()];
  render();
  handleHash();
})();
})();
</script>

</body></html>
